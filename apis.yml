aid: xtime
name: Xtime
description: 'Xtime is Cox Automotive''s service experience platform for franchised auto
  dealerships, combining online appointment scheduling, service-lane check-in, multi-point
  vehicle inspection, customer communications, service marketing, and payments into one
  fixed-operations workflow. Part of Cox Automotive since 2014 alongside Dealertrack,
  VinSolutions, Kelley Blue Book, and vAuto, Xtime integrates with DMS and dealer-website
  partners through the Cox Automotive ecosystem; it publishes no public self-serve API or
  developer portal, with partner integration handled via the Cox Automotive Integration
  Platform.'
